name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
      # No dependencies to install: the package ships code and docs, and pi's host packages
      # are peer dependencies resolved by the host at runtime. The suite stubs them so this
      # runs in a fresh checkout (test/stubs/pi-loader.mjs).
      - run: node --version
      - run: npm test
      - run: npm pack --dry-run
